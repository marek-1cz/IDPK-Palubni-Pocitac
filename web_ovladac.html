<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>IDPK Mobilní Ovladač</title>
    <style>
        :root {
            --idpk-blue: #035689;
            --idpk-dark-blue: #023e63;
            --idpk-yellow: #F4CC17;
            --idpk-green: #048E56;
            --idpk-red: #e74c3c;
            --btn-bg: #e0e0e0;
            --btn-shadow: #999;
        }

        body {
            background-color: var(--idpk-blue);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none; overflow: hidden;
        }

        .main-container {
            width: 100%; max-width: 340px; height: 100vh;
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
        }

        .system-header { 
            text-align: center; font-size: 14px; margin-bottom: 15px; 
            letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.3); 
            padding-bottom: 5px; color: white; font-weight: bold; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5); margin-top: 15px;
        }

        .drive-current-box { 
            width: 100%; padding: 12px; background: rgba(0,0,0,0.35); 
            border: 1px dashed rgba(244, 204, 23, 0.8); border-radius: 6px; 
            color: var(--idpk-yellow); font-size: 19px; font-weight: bold; 
            text-align: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); 
            margin-bottom: 10px;
        }

        #drive-controls-area { flex-shrink: 0; margin-bottom: 15px; margin-top: auto; }
        
        .big-drive-btn { 
            width: 100%; height: 60px; background-color: var(--idpk-yellow); 
            color: #333; font-weight: 900; font-size: 16px; border: none; 
            border-radius: 8px; box-shadow: 0 4px 0 #cba90f; cursor: pointer; 
            margin-bottom: 8px;
        }
        .big-drive-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #cba90f; }
        
        .small-action-btn { 
            flex: 1; height: 40px; font-size: 12px; font-weight: bold; 
            border: none; border-radius: 5px; cursor: pointer; background: #ddd; color: black; box-shadow: 0 3px 0 #999;
        }
        .small-action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #999; }

        .keypad-area { 
            flex-shrink: 0; display: grid; gap: 8px; padding-bottom: 5px; 
            grid-template-columns: repeat(4, 1fr);
            grid-template-areas: 
                "k7 k8 k9 kup"
                "k4 k5 k6 kdot"
                "k1 k2 k3 kdown"
                "kdel k0 kent kent";
        }

        .btn { 
            background-color: var(--btn-bg); border: none; border-radius: 6px; 
            height: 45px; font-size: 20px; font-weight: 600; color: #333; 
            box-shadow: 0 3px 0 var(--btn-shadow); display: flex; 
            align-items: center; justify-content: center; width: 100%;
        }
        .btn:active { box-shadow: 0 1px 0 var(--btn-shadow); transform: translateY(2px); }
        .btn-arrow { background-color: #dbe4eb; font-size: 18px; }
        .btn-confirm { background-color: var(--idpk-green); color: white; box-shadow: 0 3px 0 #025c37; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="system-header">IDPK MOBILNÍ OVLADAČ</div>
        
        <div class="drive-current-box">
            SPOJENÍ S PC AKTIVNÍ
        </div>
        <p style="color:rgba(255,255,255,0.6); font-size:11px; text-align:center; font-weight:bold;">
            MODUL ODESÍLÁ STISKY<br>ŽIVÝ TEXT ZASTÁVEK NENÍ V EXTERNÍM MÓDU DOSTUPNÝ
        </p>

        <div id="drive-controls-area">
            <button type="button" class="big-drive-btn" onclick="sendAction('space')">
                VYHLÁSIT (MEZERNÍK)
            </button>
            <div style="display:flex; gap:10px;">
                <button type="button" class="small-action-btn" onclick="sendAction('r')">OPAKOVAT (R)</button>
                <button type="button" class="small-action-btn" style="background:var(--idpk-red); color:white; box-shadow: 0 3px 0 #922b21;" onclick="sendAction('s')">STOP (S)</button>
            </div>
        </div>

        <div class="keypad-area">
            <button type="button" class="btn" style="grid-area:k7;" onclick="sendAction('7')">7</button>
            <button type="button" class="btn" style="grid-area:k8;" onclick="sendAction('8')">8</button>
            <button type="button" class="btn" style="grid-area:k9;" onclick="sendAction('9')">9</button>
            <button type="button" class="btn btn-arrow" style="grid-area:kup;" onclick="sendAction('up')">▲</button>

            <button type="button" class="btn" style="grid-area:k4;" onclick="sendAction('4')">4</button>
            <button type="button" class="btn" style="grid-area:k5;" onclick="sendAction('5')">5</button>
            <button type="button" class="btn" style="grid-area:k6;" onclick="sendAction('6')">6</button>
            <button type="button" class="btn" style="grid-area:kdot;" onclick="sendAction('dot')">●</button>

            <button type="button" class="btn" style="grid-area:k1;" onclick="sendAction('1')">1</button>
            <button type="button" class="btn" style="grid-area:k2;" onclick="sendAction('2')">2</button>
            <button type="button" class="btn" style="grid-area:k3;" onclick="sendAction('3')">3</button>
            <button type="button" class="btn btn-arrow" style="grid-area:kdown;" onclick="sendAction('down')">▼</button>
            
            <button type="button" class="btn" style="grid-area:kdel; background:#e74c3c; color:white; font-size:16px; box-shadow: 0 3px 0 #c0392b;" onclick="sendAction('del')">DEL</button>
            <button type="button" class="btn" style="grid-area:k0;" onclick="sendAction('0')">0</button>
            <button type="button" class="btn btn-confirm" style="grid-area:kent;" onclick="sendAction('ent')">ENT</button>
        </div>
    </div>

    <script>
        function sendAction(action) {
            // Pošle požadavek do Python serveru
            fetch('/press/' + action).catch(err => console.error(err));
            
            // Lehká vibrace mobilu pro lepší pocit ze stisku (Android)
            if ("vibrate" in navigator) { navigator.vibrate(30); }
        }
    </script>
</body>
</html>
